<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/fonts.css">
<script src="../../assets/stage.js"></script><script src="../../assets/hero.js"></script>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#c{position:absolute;inset:0;overflow:hidden}
.a{position:absolute}
.t{position:absolute;font-family:'Anton';color:#fff;line-height:.92;white-space:nowrap;text-transform:uppercase;-webkit-text-stroke:0;paint-order:stroke fill}
.st{-webkit-text-stroke:14px #000;text-shadow:0 14px 0 #000,0 0 60px rgba(0,0,0,.6)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 55%,rgba(0,0,0,.6))}
</style></head><body><div id="c"></div>
<script>
const G={b:'#4285F4',r:'#EA4335',y:'#FBBC05',g:'#34A853'};
const c=document.getElementById('c'); const add=(h)=>c.insertAdjacentHTML('beforeend',h);
const hero=(x,y,h,o,css='')=>`<div class="a" style="left:${x-h*400/960/2}px;top:${y-h}px;width:${h*400/960}px;height:${h}px;${css}">${HERO.svg(o)}</div>`;
const rad=(x,y,w,h,col)=>`<div class="a" style="left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px;background:radial-gradient(ellipse at center,${col},transparent 70%)"></div>`;
const robot=(x,y,s,col=G.r,eye=G.r)=>`<div class="a" style="left:${x}px;top:${y}px;width:${400*s}px;height:${520*s}px">
  <div class="a" style="left:${184*s}px;top:0;width:${32*s}px;height:${70*s}px;background:#9aa0a6;border-radius:${16*s}px"></div>
  <div class="a" style="left:${164*s}px;top:${-28*s}px;width:${72*s}px;height:${72*s}px;border-radius:50%;background:${col};box-shadow:0 0 ${50*s}px ${col}"></div>
  <div class="a" style="left:0;top:${60*s}px;width:${400*s}px;height:${300*s}px;border-radius:${90*s}px;background:linear-gradient(160deg,#f1f3f6,#9aa3b2);box-shadow:0 ${30*s}px ${60*s}px rgba(0,0,0,.5)">
   <div class="a" style="left:${36*s}px;top:${36*s}px;right:${36*s}px;bottom:${36*s}px;border-radius:${64*s}px;background:#0b1020;box-shadow:inset 0 0 ${40*s}px ${eye}88">
    <div class="a" style="left:${70*s}px;top:${70*s}px;width:${60*s}px;height:${40*s}px;background:${eye};box-shadow:0 0 ${30*s}px ${eye};clip-path:polygon(0 0,100% 40%,100% 100%,0 100%)"></div>
    <div class="a" style="right:${70*s}px;top:${70*s}px;width:${60*s}px;height:${40*s}px;background:${eye};box-shadow:0 0 ${30*s}px ${eye};clip-path:polygon(0 40%,100% 0,100% 100%,0 100%)"></div>
    <div class="a" style="left:${110*s}px;top:${150*s}px;width:${108*s}px;height:${16*s}px;background:${eye};border-radius:${8*s}px;box-shadow:0 0 ${20*s}px ${eye}"></div></div></div>
  <div class="a" style="left:${80*s}px;top:${372*s}px;width:${240*s}px;height:${150*s}px;border-radius:${50*s}px;background:linear-gradient(160deg,#e6e9ee,#8a93a2)"></div></div>`;
const T={
// 1. AI takes your job: robot hand snatches the job badge
t1(){add(`<div class="a" style="inset:0;background:radial-gradient(ellipse 70% 90% at 70% 40%,#7a0d0d,#1a0204 75%)"></div>${rad(1350,420,1400,1100,'rgba(234,67,53,.55)')}
 ${robot(1080,170,1.45,G.r,G.r)}
 <div class="a" style="left:640px;top:600px;width:560px;height:150px;border-radius:75px;background:linear-gradient(180deg,#d6dbe3,#8b94a3);transform:rotate(-14deg);transform-origin:100% 50%"></div>
 <div class="a" style="left:500px;top:560px;width:260px;height:220px;border-radius:60px 80px 80px 60px;background:linear-gradient(160deg,#eef1f5,#9aa3b2);transform:rotate(-14deg)"></div>
 <div class="a" style="left:420px;top:540px;width:250px;height:180px;border-radius:24px;background:#fff;transform:rotate(-24deg);box-shadow:0 30px 60px rgba(0,0,0,.6);padding:24px;box-sizing:border-box"><div style="font:900 44px Figtree;color:#202124">MY JOB</div><div style="height:16px;width:80%;background:#dfe5ee;border-radius:8px;margin-top:20px"></div><div style="width:60px;height:60px;border-radius:50%;background:${G.b};position:absolute;right:24px;bottom:22px"></div></div>
 ${hero(330,1290,900,{pose:'worried',face:'shocked',look:[0.9,-0.3],rim:'#ff8a80',rim2:'#ff8a80',id:'a'})}
 <div class="t st" style="left:60px;top:40px;font-size:200px">AI TAKES</div>
 <div class="t st" style="left:60px;top:220px;font-size:200px;color:${G.y}">YOUR JOB</div>
 <div class="a" style="left:1440px;top:820px;padding:14px 40px;background:${G.r};border-radius:20px;transform:rotate(-4deg);box-shadow:0 14px 0 #000"><span class="t" style="position:relative;font-size:130px">2030</span></div><div class="vig"></div>`)},
// 2. Replaced vs promoted split
t2(){add(`<div class="a" style="left:0;top:0;width:960px;height:1080px;background:linear-gradient(160deg,#3a3d44,#14161a);filter:saturate(0)"></div>
 <div class="a" style="left:960px;top:0;width:960px;height:1080px;background:radial-gradient(ellipse at 60% 40%,#1f7a3a,#06240f 80%)"></div>${rad(1440,420,1000,900,'rgba(52,168,83,.6)')}
 <div class="a" style="left:930px;top:-40px;width:60px;height:1200px;background:#fff;transform:rotate(6deg);box-shadow:0 0 40px #000"></div>
 <div class="a" style="filter:grayscale(1) brightness(.7)">${hero(470,1160,880,{pose:'worried',face:'sad',look:[0,0.4],rim:'#999',rim2:'#999',id:'b1',top:'shirt',topColor:'#9aa0a6',tie:'#555'})}</div>
 <div class="a" style="left:250px;top:800px;width:440px;height:260px;background:linear-gradient(180deg,#b08a5a,#7a5a34);border-radius:8px;box-shadow:0 20px 40px rgba(0,0,0,.6)"><div style="position:absolute;left:0;right:0;top:0;height:40px;background:#c9a36e"></div></div>
 ${hero(1440,1170,900,{pose:'cheer',face:'happy',look:[0,-0.4],rim:G.y,rim2:'#fff',id:'b2',top:'blazer',topColor:G.b,inner:'#fff',tie:G.y})}
 <div class="t st" style="left:60px;top:60px;font-size:150px;color:#ddd">REPLACED</div>
 <div class="t st" style="left:1000px;top:60px;font-size:150px;color:${G.g}">PROMOTED</div>
 <div class="a" style="left:740px;top:430px;width:440px;height:220px;background:${G.y};clip-path:polygon(0 30%,60% 30%,60% 0,100% 50%,60% 100%,60% 70%,0 70%);filter:drop-shadow(0 12px 0 #000)"></div>
 <div class="t st" style="left:960px;top:880px;font-size:150px;transform:translateX(-50%)">SWITCH NOW</div><div class="vig"></div>`)},
// 3. Is your job next? 10 jobs crossed out
t3(){const icons=['⌨️','🎧','✍️','📒','🧪','🗣️','🎨','⚖️','🏦','☎️'];
 add(`<div class="a" style="inset:0;background:radial-gradient(ellipse 80% 80% at 30% 50%,#122a5c,#040814 75%)"></div>${rad(1300,520,1200,1000,'rgba(66,133,244,.35)')}
 ${icons.map((ic,i)=>{const x=980+(i%5)*175,y=230+Math.floor(i/5)*230;return `<div class="a" style="left:${x}px;top:${y}px;width:150px;height:150px;border-radius:34px;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);font-size:90px;line-height:150px;text-align:center">${ic}</div><div class="a" style="left:${x-6}px;top:${y+66}px;width:162px;height:18px;background:${G.r};transform:rotate(-38deg);box-shadow:0 0 18px ${G.r},0 4px 0 #000"></div>`}).join('')}
 ${hero(470,1200,1080,{pose:'worried',face:'shocked',look:[0.8,-0.2],rim:'#8ab4f8',rim2:G.b,id:'c'})}
 <div class="t st" style="left:960px;top:50px;font-size:170px">IS YOUR JOB</div>
 <div class="t st" style="left:1060px;top:740px;font-size:300px;color:${G.r}">NEXT?</div><div class="vig"></div>`)},
// 4. Robot takes the desk, you leave with a box
t4(){add(`<div class="a" style="inset:0;background:linear-gradient(180deg,#1b2440,#0a0f1c)"></div>${rad(1300,380,1100,800,'rgba(66,133,244,.45)')}
 <div class="a" style="left:1000px;top:700px;width:860px;height:60px;background:#6d4c41;border-radius:10px"></div><div class="a" style="left:1050px;top:760px;width:40px;height:320px;background:#4e342e"></div><div class="a" style="left:1760px;top:760px;width:40px;height:320px;background:#4e342e"></div>
 <div class="a" style="left:1450px;top:470px;width:360px;height:230px;border-radius:14px;background:#141820;border:12px solid #2a2f3a;box-shadow:0 0 50px rgba(66,133,244,.6)"><div style="margin:20px;height:160px;background:linear-gradient(180deg,${G.b},#0b2a6a);border-radius:6px"></div></div>
 ${robot(1080,170,1.0,G.b,G.b)}
 ${hero(520,1300,900,{pose:'idle',face:'sad',look:[0.9,0],rim:'#8ab4f8',rim2:G.b,id:'d',arms:{la:[-24,80,'fist'],ra:[24,-80,'fist']}})}
 <div class="a" style="left:300px;top:840px;width:440px;height:280px;background:linear-gradient(180deg,#c9a36e,#8a6438);border-radius:8px;box-shadow:0 20px 40px rgba(0,0,0,.6)"><div style="position:absolute;left:40px;top:-60px;width:80px;height:100px;background:#34A853;border-radius:40px 40px 6px 6px"></div><div style="position:absolute;left:200px;top:-40px;width:150px;height:60px;background:#f4f2ef;transform:rotate(8deg)"></div></div>
 <div class="t st" style="left:60px;top:40px;font-size:230px;color:${G.y}">10 JOBS</div>
 <div class="t st" style="left:60px;top:250px;font-size:230px">GONE</div>
 <div class="a" style="left:1400px;top:860px;padding:10px 36px;background:#000;border-radius:16px;border:6px solid ${G.r}"><span class="t" style="position:relative;font-size:120px;color:${G.r}">BY 2030</span></div><div class="vig"></div>`)},
// 5. Do this before 2030: switch to a new job
t5(){add(`<div class="a" style="inset:0;background:radial-gradient(ellipse 80% 90% at 70% 50%,#2a1f06,#0a0802 75%)"></div>${rad(1250,560,1300,1100,'rgba(251,188,5,.45)')}
 ${[0,1,2,3,4,5,6,7].map(i=>`<div class="a" style="left:1100px;top:560px;width:1400px;height:${60+i*8}px;transform-origin:0 50%;transform:rotate(${-150+i*40}deg);background:linear-gradient(90deg,rgba(255,240,190,.35),transparent)"></div>`).join('')}
 <div class="a" style="left:1000px;top:200px;width:820px;height:680px;background:${G.g};clip-path:polygon(0 70%,45% 70%,45% 100%,100% 45%,45% -10%,45% 30%,0 30%);transform:rotate(-30deg);filter:drop-shadow(0 16px 0 #000)"></div>
 <div class="t st" style="left:1180px;top:430px;font-size:120px;transform:rotate(-30deg)">NEW JOB</div>
 ${hero(500,1310,960,{pose:'point',face:'determined',look:[0.9,-0.3],rim:G.y,rim2:'#fff',id:'e',top:'blazer',topColor:G.r,inner:'#fff'})}
 <div class="t st" style="left:60px;top:40px;font-size:190px">DO THIS</div>
 <div class="t st" style="left:60px;top:220px;font-size:190px;color:${G.y}">BEFORE 2030</div>
 <div class="a" style="left:1240px;top:850px;display:flex;gap:16px">${['A','I'].map((ch,i)=>`<span class="t st" style="position:relative;font-size:150px;color:${[G.b,G.r][i]}">${ch}</span>`).join('')}<span class="t st" style="position:relative;font-size:150px">-PROOF</span></div><div class="vig"></div>`)},
};
(T[location.hash.slice(1)]||T.t1)();
</script></body></html>
